name: Build iOS IPA & Publish SideStore Source

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Publish MapleAssistant.ipa
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Release app for iOS device (arm64)
        run: |
          xcodebuild \
            -project MapleAssistant.xcodeproj \
            -scheme MapleAssistant \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Payload into MapleAssistant.ipa & read metadata
        id: meta
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MapleAssistant.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: $APP_PATH not found!"
            find build -maxdepth 5
            exit 1
          fi

          rm -rf Payload MapleAssistant.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          echo "=== Verifying executable architecture ==="
          file Payload/MapleAssistant.app/MapleAssistant

          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/MapleAssistant.app/Info.plist)
          APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/MapleAssistant.app/Info.plist)
          COMMIT_MSG=$(git log -1 --pretty=%s)

          zip -r -y MapleAssistant.ipa Payload
          ls -lh MapleAssistant.ipa

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD" >> "$GITHUB_OUTPUT"
          echo "notes=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Upload MapleAssistant.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapleAssistant-iOS-IPA
          path: MapleAssistant.ipa
          retention-days: 90

      - name: Publish GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: 楓 v${{ steps.meta.outputs.version }} (Build ${{ steps.meta.outputs.build }})
          body: ${{ steps.meta.outputs.notes }}
          files: MapleAssistant.ipa
          make_latest: true

      - name: Generate and publish SideStore source.json to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin gh-pages 2>/dev/null && git show origin/gh-pages:source.json > prev_source.json 2>/dev/null || true

          mkdir -p gh_pages_dist
          cp MapleAssistant/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png gh_pages_dist/icon.png

          python3 scripts/generate_sidestore_source.py \
            --repo "${{ github.repository }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --build "${{ steps.meta.outputs.build }}" \
            --ipa "MapleAssistant.ipa" \
            --notes "${{ steps.meta.outputs.notes }}" \
            --prev "prev_source.json" \
            --out-dir "gh_pages_dist"

          cd gh_pages_dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update SideStore source to v${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.build }})"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
