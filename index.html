<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>楓 — SideStore 專屬更新來源</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #0f0f0f;
      color: #e3e3e3;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #161616;
      border: 1px solid #2f2f2f;
      border-radius: 20px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .icon {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      box-shadow: 0 10px 28px rgba(232, 93, 42, 0.25);
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 6px; font-size: 26px; color: #fff; }
    .sub { margin: 0 0 14px; font-size: 13px; color: #9b9b9b; }
    .badge {
      display: inline-block;
      background: #222;
      border: 1px solid #333;
      color: #10b981;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #2383e2; color: #fff; }
    .btn-secondary { background: #242424; color: #e3e3e3; border: 1px solid #333; }
    .url-box {
      margin-top: 14px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11px;
      color: #8b8b8b;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .msg {
      min-height: 18px;
      font-size: 12px;
      color: #10b981;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="icon.png" alt="楓 App Icon">
    <h1>🍁 楓</h1>
    <p class="sub">楓之谷 M 行動小助手・SideStore 專屬更新來源</p>
    <div class="badge">最新版本 v1.3.1 (Build 5)・689.8 KB</div>

    <a class="btn btn-primary" href="sidestore://source?url=https://a0932131523-prog.github.io/maple-ios-app/source.json">⚡ 一鍵加入 SideStore 來源</a>
    <button class="btn btn-secondary" onclick="copySource()">📋 複製來源網址（手動貼進 SideStore）</button>
    <a class="btn btn-secondary" href="https://github.com/a0932131523-prog/maple-ios-app/releases/download/v1.3.1/MapleAssistant.ipa">📦 直接下載最新 IPA</a>

    <div class="url-box" id="srcUrl">https://a0932131523-prog.github.io/maple-ios-app/source.json</div>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    function copySource() {
      const text = document.getElementById('srcUrl').textContent;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          document.getElementById('msg').textContent = '✅ 已複製來源網址！打開 SideStore → Sources → + 貼上即可';
        });
      }
    }
  </script>
</body>
</html>
